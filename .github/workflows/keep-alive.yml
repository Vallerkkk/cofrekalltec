name: Keep alive

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no healthz
        # O Render free dorme após 15 min sem requisições.
        run: curl -fsS --max-time 120 --retry 3 --retry-delay 20 https://cofrekalltec.onrender.com/healthz
